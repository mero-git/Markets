# ============================================================================
# Friday Markets Note - single source of configuration.
# Canadian rates and credit first, US as read-across, everything else brief.
# Recipients live in secrets (env), never here. See README.
# ============================================================================

timezone: America/New_York

delivery:
  # Local ET wall-clock send time; DST handled via zoneinfo, never a UTC offset.
  send_time_local: "06:30"
  # Weekly note: Fridays only. 0=Mon .. 4=Fri.
  send_weekdays: [4]
  holiday_calendar: NYSE
  bond_calendar: SIFMAUS

run:
  # self | test | full. Promoted manually. Default stays self until trusted.
  # Override per run with env RECIPIENT_TIER.
  recipient_tier: self
  # Overridable per run via env MODEL.
  model: claude-opus-5

generation:
  effort: high
  max_tokens: 8000

news:
  # Hard cap. Brevity is credibility.
  max_items: 4
  max_searches: 8

email:
  title: "Friday Markets Note"
  sender_name: "Mero Obuwoma"
  sender_descriptor: "Weekly markets recap. Personal publication, not investment advice."

# ----------------------------------------------------------------------------
# Instruments.
#   key / label / section / source / symbol
#   cls:        sanity-check class
#   freshness:  live | daily
#   unit:       display unit; credit spreads scaled to bp
#   scale:      optional multiplier on the raw value
#   note:       honesty label carried into the payload
#
# Sections, in the order the note reads:
#   ca_rates, ca_credit, us_rates, credit, fx, commodities, equities,
#   volatility, crypto
# ----------------------------------------------------------------------------
instruments:

  # --- Canada: the anchor section -------------------------------------------
  - {key: boc_target, label: "BoC target rate", section: ca_rates, source: boc, symbol: V39079, cls: policy_rate, freshness: daily, unit: "%", note: "Bank of Canada target for the overnight rate"}
  - {key: corra, label: "CORRA", section: ca_rates, source: boc, symbol: AVG.INTWO, cls: policy_rate, freshness: daily, unit: "%", note: "Canadian Overnight Repo Rate Average"}
  - {key: goc_2y, label: "GoC 2Y", section: ca_rates, source: boc, symbol: BD.CDN.2YR.DQ.YLD, cls: yield_pct, freshness: daily, unit: "%", note: "BoC benchmark close"}
  - {key: goc_5y, label: "GoC 5Y", section: ca_rates, source: boc, symbol: BD.CDN.5YR.DQ.YLD, cls: yield_pct, freshness: daily, unit: "%", note: "BoC benchmark close"}
  - {key: goc_10y, label: "GoC 10Y", section: ca_rates, source: boc, symbol: BD.CDN.10YR.DQ.YLD, cls: yield_pct, freshness: daily, unit: "%", note: "BoC benchmark close"}
  - {key: goc_30y, label: "GoC long", section: ca_rates, source: boc, symbol: BD.CDN.LONG.DQ.YLD, cls: yield_pct, freshness: daily, unit: "%", note: "BoC long-term benchmark close"}

  # --- US rates: the read-across for a CAD book ------------------------------
  - {key: ust_2y,  label: "UST 2Y",  section: us_rates, source: fred, symbol: DGS2,  cls: yield_pct, freshness: daily, unit: "%", note: "H.15 close"}
  - {key: ust_5y,  label: "UST 5Y",  section: us_rates, source: fred, symbol: DGS5,  cls: yield_pct, freshness: daily, unit: "%", note: "H.15 close"}
  - {key: ust_10y, label: "UST 10Y", section: us_rates, source: fred, symbol: DGS10, cls: yield_pct, freshness: daily, unit: "%", note: "H.15 close"}
  - {key: ust_30y, label: "UST 30Y", section: us_rates, source: fred, symbol: DGS30, cls: yield_pct, freshness: daily, unit: "%", note: "H.15 close"}
  - {key: breakeven_10y, label: "10Y breakeven", section: us_rates, source: fred, symbol: T10YIE, cls: real_yield_pct, freshness: daily, unit: "%", note: "H.15-derived close"}

  # --- Credit. No free Canadian OAS exists; US indices are the read-across. ---
  - {key: ig_oas, label: "US IG OAS", section: credit, source: fred, symbol: BAMLC0A0CM,   cls: spread_bp, freshness: daily, unit: bp, scale: 100, staleness_hours: 200, note: "ICE BofA index, publishes with a 1-2 day lag"}
  - {key: hy_oas, label: "US HY OAS", section: credit, source: fred, symbol: BAMLH0A0HYM2, cls: spread_bp, freshness: daily, unit: bp, scale: 100, staleness_hours: 200, note: "ICE BofA index, publishes with a 1-2 day lag"}

  # --- FX. USD/CAD leads. ----------------------------------------------------
  - {key: usdcad, label: "USD/CAD", section: fx, source: yahoo, symbol: "CAD=X",    cls: fx,       freshness: live, unit: rate}
  - {key: dxy,    label: "DXY",     section: fx, source: yahoo, symbol: "DX-Y.NYB", cls: fx_index, freshness: live, unit: index}
  - {key: eurusd, label: "EUR/USD", section: fx, source: yahoo, symbol: "EURUSD=X", cls: fx,       freshness: live, unit: rate}
  - {key: usdjpy, label: "USD/JPY", section: fx, source: yahoo, symbol: "JPY=X",    cls: fx_jpy,   freshness: live, unit: rate}

  # --- Commodities. WTI and nat gas carry the Canadian terms of trade. -------
  - {key: wti,    label: "WTI",     section: commodities, source: yahoo, symbol: "CL=F", cls: commodity, freshness: live, unit: "$/bbl"}
  - {key: brent,  label: "Brent",   section: commodities, source: yahoo, symbol: "BZ=F", cls: commodity, freshness: live, unit: "$/bbl"}
  - {key: natgas, label: "Nat gas", section: commodities, source: yahoo, symbol: "NG=F", cls: natgas,    freshness: live, unit: "$/MMBtu"}
  - {key: gold,   label: "Gold",    section: commodities, source: yahoo, symbol: "GC=F", cls: commodity, freshness: live, unit: "$/oz"}
  - {key: copper, label: "Copper",  section: commodities, source: yahoo, symbol: "HG=F", cls: commodity, freshness: live, unit: "$/lb"}

  # --- Equities. Four, deliberately. Cash closes, not futures. ---------------
  - {key: tsx,    label: "S&P/TSX Composite", section: equities, source: yahoo, symbol: "^GSPTSE", cls: equity, freshness: daily, unit: index, note: "Index close"}
  - {key: spx,    label: "S&P 500",           section: equities, source: yahoo, symbol: "^GSPC",   cls: equity, freshness: daily, unit: index, note: "Index close"}
  - {key: nasdaq, label: "Nasdaq Composite",  section: equities, source: yahoo, symbol: "^IXIC",   cls: equity, freshness: daily, unit: index, note: "Index close"}
  - {key: dow,    label: "Dow Jones",         section: equities, source: yahoo, symbol: "^DJI",    cls: equity, freshness: daily, unit: index, note: "Index close"}

  # --- Volatility. MOVE is the rates analogue and matters more here. ---------
  - {key: move, label: "MOVE", section: volatility, source: yahoo, symbol: "^MOVE", cls: move_index, freshness: daily, unit: index, note: "Rates volatility, prior close"}
  - {key: vix,  label: "VIX",  section: volatility, source: yahoo, symbol: "^VIX",  cls: vol_index,  freshness: daily, unit: index, note: "Prior close"}

  # --- Crypto. One line. -----------------------------------------------------
  - {key: btc, label: "Bitcoin", section: crypto, source: yahoo, symbol: "BTC-USD", cls: crypto, freshness: live, unit: USD}

# ----------------------------------------------------------------------------
# Derived values, computed in the data layer so the model never does arithmetic.
# Both legs must have survived sanity checks or the derived value is omitted.
# ----------------------------------------------------------------------------
derived:
  - {key: goc_2s10s,  label: "GoC 2s10s",   section: ca_rates, kind: yield_spread_bp, a: goc_10y, b: goc_2y,  note: "BoC benchmark closes"}
  - {key: goc_5s30s,  label: "GoC 5s30s",   section: ca_rates, kind: yield_spread_bp, a: goc_30y, b: goc_5y,  note: "BoC benchmark closes"}
  - {key: ca_us_2y,   label: "Canada-US 2Y",  section: ca_rates, kind: yield_spread_bp, a: goc_2y,  b: ust_2y,  note: "BoC benchmark vs H.15"}
  - {key: ca_us_10y,  label: "Canada-US 10Y", section: ca_rates, kind: yield_spread_bp, a: goc_10y, b: ust_10y, note: "BoC benchmark vs H.15"}
  - {key: ust_2s10s,  label: "UST 2s10s",   section: us_rates, kind: yield_spread_bp, a: ust_10y, b: ust_2y,  note: "H.15 closes"}
  - {key: ust_5s30s,  label: "UST 5s30s",   section: us_rates, kind: yield_spread_bp, a: ust_30y, b: ust_5y,  note: "H.15 closes"}

# ----------------------------------------------------------------------------
# Sanity classes: plausible level bounds, plus max plausible 1-day and 1-week
# moves. A value outside these is treated as bad data, logged, and omitted.
# ----------------------------------------------------------------------------
sanity:
  equity:          {min: 50,    max: 200000,  max_change_pct: 12,  max_week_change_pct: 25}
  fx:              {min: 0.2,   max: 5,       max_change_pct: 5,   max_week_change_pct: 10}
  fx_jpy:          {min: 50,    max: 400,     max_change_pct: 5,   max_week_change_pct: 10}
  fx_index:        {min: 60,    max: 180,     max_change_pct: 5,   max_week_change_pct: 10}
  commodity:       {min: 0.5,   max: 20000,   max_change_pct: 20,  max_week_change_pct: 35}
  natgas:          {min: 0.5,   max: 60,      max_change_pct: 35,  max_week_change_pct: 60}
  vol_index:       {min: 5,     max: 200,     max_change_pct: 200, max_week_change_pct: 300}
  move_index:      {min: 30,    max: 400,     max_change_pct: 80,  max_week_change_pct: 150}
  yield_pct:       {min: -1.5,  max: 12,      max_change_bp: 80,   max_week_change_bp: 150}
  real_yield_pct:  {min: -3,    max: 8,       max_change_bp: 80,   max_week_change_bp: 150}
  policy_rate:     {min: -1,    max: 15,      max_change_bp: 100,  max_week_change_bp: 100}
  spread_bp:       {min: 20,    max: 3000,    max_change_bp: 150,  max_week_change_bp: 300, bp_per_unit: 1}
  crypto:          {min: 1,     max: 1000000, max_change_pct: 30,  max_week_change_pct: 50}

# Correlated pairs. If two legs that normally move together diverge by more
# than the tolerance, both are rejected as likely bad data (for example a
# futures contract roll putting a stale prior close behind one leg).
correlated_pairs:
  - {a: wti, b: brent, max_divergence_pct: 3.0, basis: week}
  - {a: spx, b: dow,   max_divergence_pct: 6.0, basis: week}

# A point older than this is treated as failed, not passed through.
staleness_hours:
  live: 96
  daily: 168

health:
  critical_keys: [goc_2y, goc_10y, ust_2y, ust_10y, ig_oas, hy_oas, usdcad]
  max_failure_ratio: 0.25

auction_typical_times_et:
  Bill: "11:30"
  Note: "13:00"
  Bond: "13:00"
  CMB: "11:30"
  TIPS: "13:00"
  FRN: "11:30"
