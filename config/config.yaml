# ============================================================================
# Blackleaf Capital daily market brief — single source of configuration.
# Tickers, thresholds, schedule, model choice, and delivery settings all live
# here. Recipients live in secrets (env), never here — see README.
# ============================================================================

timezone: America/New_York

delivery:
  # Local ET wall-clock send time; DST handled via zoneinfo, never a UTC offset.
  send_time_local: "06:30"
  # Skip days the NYSE is closed. SIFMA (US bond market) status is also
  # computed and surfaced in the payload so the note can say "bond market
  # closed today" on days like Columbus Day.
  holiday_calendar: NYSE
  bond_calendar: SIFMAUS

run:
  # self | test | full — promoted manually. Default stays self until trusted.
  recipient_tier: self
  # Model used by the generation layer; overridable per run via env MODEL.
  model: claude-sonnet-5

# ----------------------------------------------------------------------------
# Instruments. Each entry:
#   key:      stable identifier used everywhere downstream
#   label:    human label used in output
#   section:  grouping for the brief
#   source:   yahoo | fred | boc | mof_jgb | bundesbank | boe
#   symbol:   ticker / series id at the source
#   cls:      sanity-check class (see sanity: below)
#   freshness: live | daily   (drives staleness thresholds and labeling)
#   unit:     display unit; yields in %, credit spreads converted to bp
#   scale:    optional multiplier applied to raw value (e.g. OAS % -> bp)
#   note:     honesty label carried into the payload
# ----------------------------------------------------------------------------
instruments:
  # --- US Treasury curve: official prior close (FRED H.15) ---
  - {key: ust_2y,  label: "UST 2Y (prior close)",  section: curve, source: fred, symbol: DGS2,  cls: yield_pct, freshness: daily, unit: "%", note: "Official H.15 close; publishes next day"}
  - {key: ust_5y,  label: "UST 5Y (prior close)",  section: curve, source: fred, symbol: DGS5,  cls: yield_pct, freshness: daily, unit: "%", note: "Official H.15 close; publishes next day"}
  - {key: ust_10y, label: "UST 10Y (prior close)", section: curve, source: fred, symbol: DGS10, cls: yield_pct, freshness: daily, unit: "%", note: "Official H.15 close; publishes next day"}
  - {key: ust_30y, label: "UST 30Y (prior close)", section: curve, source: fred, symbol: DGS30, cls: yield_pct, freshness: daily, unit: "%", note: "Official H.15 close; publishes next day"}

  # --- US yield futures (CBOT micro yield futures): the live overnight move ---
  - {key: ust_2y_fut,  label: "2Y yield fut",  section: curve, source: yahoo, symbol: "2YY=F", cls: yield_pct, freshness: live, unit: "%", note: "CBOT yield future, cash proxy"}
  - {key: ust_5y_fut,  label: "5Y yield fut",  section: curve, source: yahoo, symbol: "5YY=F", cls: yield_pct, freshness: live, unit: "%", note: "CBOT yield future, cash proxy"}
  - {key: ust_10y_fut, label: "10Y yield fut", section: curve, source: yahoo, symbol: "10Y=F", cls: yield_pct, freshness: live, unit: "%", note: "CBOT yield future, cash proxy"}
  - {key: ust_30y_fut, label: "30Y yield fut", section: curve, source: yahoo, symbol: "30Y=F", cls: yield_pct, freshness: live, unit: "%", note: "CBOT yield future, cash proxy"}

  # --- Real rates / inflation (FRED, prior close) ---
  - {key: tips_10y_real, label: "10Y TIPS real yield", section: curve, source: fred, symbol: DFII10, cls: real_yield_pct, freshness: daily, unit: "%", note: "Prior close"}
  - {key: breakeven_10y, label: "10Y breakeven",       section: curve, source: fred, symbol: T10YIE, cls: real_yield_pct, freshness: daily, unit: "%", note: "Prior close"}

  # --- Global 10Y govvies (official daily sources, prior close) ---
  - {key: bund_10y, label: "Bund 10Y (prior close)", section: curve, source: bundesbank, symbol: "BBSIS.D.I.ZAR.ZI.EUR.S1311.B.A604.R10XX.R.A.A._Z._Z.A", cls: yield_pct, freshness: daily, unit: "%", note: "Bundesbank daily yield, prior close"}
  - {key: jgb_10y,  label: "JGB 10Y (prior close)",  section: curve, source: mof_jgb, symbol: "10Y", cls: yield_pct, freshness: daily, unit: "%", note: "Japan MoF daily yield, prior close"}
  - {key: gilt_10y, label: "Gilt 10Y (prior close)", section: curve, source: boe, symbol: IUDMNZC, cls: yield_pct, freshness: daily, unit: "%", note: "BoE 10Y nominal zero-coupon, prior close; publishes with a lag"}

  # --- Canada rates (Bank of Canada Valet, prior close) ---
  - {key: goc_2y,  label: "GoC 2Y (prior close)",  section: canada, source: boc, symbol: BD.CDN.2YR.DQ.YLD,  cls: yield_pct, freshness: daily, unit: "%", note: "BoC benchmark, prior close"}
  - {key: goc_10y, label: "GoC 10Y (prior close)", section: canada, source: boc, symbol: BD.CDN.10YR.DQ.YLD, cls: yield_pct, freshness: daily, unit: "%", note: "BoC benchmark, prior close"}

  # --- Credit (ICE BofA OAS via FRED; publishes with a lag — label honestly) ---
  - {key: ig_oas, label: "US IG OAS", section: credit, source: fred, symbol: BAMLC0A0CM,    cls: spread_bp, freshness: daily, unit: bp, scale: 100, staleness_hours: 200, note: "ICE BofA index, publishes with ~1-2 day lag"}
  - {key: hy_oas, label: "US HY OAS", section: credit, source: fred, symbol: BAMLH0A0HYM2, cls: spread_bp, freshness: daily, unit: bp, scale: 100, staleness_hours: 200, note: "ICE BofA index, publishes with ~1-2 day lag"}

  # --- Equity futures (live overnight) ---
  - {key: spx_fut,    label: "S&P 500 fut",  section: equity_futures, source: yahoo, symbol: "ES=F", cls: equity, freshness: live, unit: index}
  - {key: nasdaq_fut, label: "Nasdaq fut",   section: equity_futures, source: yahoo, symbol: "NQ=F", cls: equity, freshness: live, unit: index}
  - {key: dow_fut,    label: "Dow fut",      section: equity_futures, source: yahoo, symbol: "YM=F", cls: equity, freshness: live, unit: index}

  # --- Asia close ---
  - {key: nikkei,   label: "Nikkei 225",     section: asia, source: yahoo, symbol: "^N225",     cls: equity, freshness: live, unit: index, note: "Session close"}
  - {key: hang_seng, label: "Hang Seng",     section: asia, source: yahoo, symbol: "^HSI",      cls: equity, freshness: live, unit: index, note: "Session close"}
  - {key: shanghai, label: "Shanghai Comp",  section: asia, source: yahoo, symbol: "000001.SS", cls: equity, freshness: live, unit: index, note: "Session close"}
  - {key: asx,      label: "ASX 200",        section: asia, source: yahoo, symbol: "^AXJO",     cls: equity, freshness: live, unit: index, note: "Session close"}

  # --- Europe mid-morning (intraday at 6:30 ET — labeled as such) ---
  - {key: stoxx50, label: "Euro Stoxx 50", section: europe, source: yahoo, symbol: "^STOXX50E", cls: equity, freshness: live, unit: index, note: "Intraday level, not a close"}
  - {key: dax,     label: "DAX",           section: europe, source: yahoo, symbol: "^GDAXI",    cls: equity, freshness: live, unit: index, note: "Intraday level, not a close"}
  - {key: ftse,    label: "FTSE 100",      section: europe, source: yahoo, symbol: "^FTSE",     cls: equity, freshness: live, unit: index, note: "Intraday level, not a close"}
  - {key: cac,     label: "CAC 40",        section: europe, source: yahoo, symbol: "^FCHI",     cls: equity, freshness: live, unit: index, note: "Intraday level, not a close"}

  # --- Canada equity (no free TSX futures feed — prior close, labeled) ---
  - {key: tsx, label: "TSX Composite (prior close)", section: canada, source: yahoo, symbol: "^GSPTSE", cls: equity, freshness: daily, unit: index, note: "Prior close; SXF futures not available from free sources"}

  # --- FX ---
  - {key: dxy,    label: "DXY",     section: fx, source: yahoo, symbol: "DX-Y.NYB", cls: fx_index, freshness: live, unit: index}
  - {key: usdcad, label: "USD/CAD", section: fx, source: yahoo, symbol: "CAD=X",    cls: fx,       freshness: live, unit: rate}
  - {key: eurusd, label: "EUR/USD", section: fx, source: yahoo, symbol: "EURUSD=X", cls: fx,       freshness: live, unit: rate}
  - {key: usdjpy, label: "USD/JPY", section: fx, source: yahoo, symbol: "JPY=X",    cls: fx_jpy,   freshness: live, unit: rate}

  # --- Commodities ---
  - {key: wti,    label: "WTI",     section: commodities, source: yahoo, symbol: "CL=F", cls: commodity, freshness: live, unit: "$/bbl"}
  - {key: brent,  label: "Brent",   section: commodities, source: yahoo, symbol: "BZ=F", cls: commodity, freshness: live, unit: "$/bbl"}
  - {key: gold,   label: "Gold",    section: commodities, source: yahoo, symbol: "GC=F", cls: commodity, freshness: live, unit: "$/oz"}
  - {key: copper, label: "Copper",  section: commodities, source: yahoo, symbol: "HG=F", cls: commodity, freshness: live, unit: "$/lb"}
  - {key: natgas, label: "Nat gas", section: commodities, source: yahoo, symbol: "NG=F", cls: natgas, freshness: live, unit: "$/MMBtu"}

  # --- Volatility ---
  - {key: vix,  label: "VIX",        section: volatility, source: yahoo, symbol: "^VIX",  cls: vol_index, freshness: live, unit: index}
  - {key: move, label: "MOVE index", section: volatility, source: yahoo, symbol: "^MOVE", cls: move_index, freshness: daily, unit: index, note: "Updates end-of-day; prior close"}

  # --- Crypto (one line max downstream) ---
  - {key: btc, label: "BTC", section: crypto, source: yahoo, symbol: "BTC-USD", cls: crypto, freshness: live, unit: USD}
  - {key: eth, label: "ETH", section: crypto, source: yahoo, symbol: "ETH-USD", cls: crypto, freshness: live, unit: USD}

# ----------------------------------------------------------------------------
# Derived values — computed in the data layer so the model never does math.
# a/b reference instrument keys; both legs must have survived sanity checks.
# ----------------------------------------------------------------------------
derived:
  - {key: ust_2s10s_fut, label: "2s10s (yield-fut proxy)", section: curve, kind: yield_spread_bp, a: ust_10y_fut, b: ust_2y_fut, note: "From CBOT yield futures"}
  - {key: ust_5s30s_fut, label: "5s30s (yield-fut proxy)", section: curve, kind: yield_spread_bp, a: ust_30y_fut, b: ust_5y_fut, note: "From CBOT yield futures"}
  - {key: ust_2s10s, label: "2s10s (prior close)", section: curve, kind: yield_spread_bp, a: ust_10y, b: ust_2y, note: "Official H.15 closes"}
  - {key: ust_5s30s, label: "5s30s (prior close)", section: curve, kind: yield_spread_bp, a: ust_30y, b: ust_5y, note: "Official H.15 closes"}
  - {key: ca_us_10y, label: "Canada–US 10Y spread", section: canada, kind: yield_spread_bp, a: goc_10y, b: ust_10y, note: "Prior closes, BoC vs H.15"}

# ----------------------------------------------------------------------------
# Sanity-check classes: plausible level bounds and max plausible one-day move.
# A value outside these is treated as bad data, logged, and omitted.
# ----------------------------------------------------------------------------
sanity:
  equity:          {min: 50,    max: 200000, max_change_pct: 12}
  fx:              {min: 0.2,   max: 5,      max_change_pct: 5}
  fx_jpy:          {min: 50,    max: 400,    max_change_pct: 5}
  fx_index:        {min: 60,    max: 180,    max_change_pct: 5}
  commodity:       {min: 0.5,   max: 20000,  max_change_pct: 20}
  natgas:          {min: 0.5,   max: 60,     max_change_pct: 35}
  vol_index:       {min: 5,     max: 200,    max_change_pct: 200}
  move_index:      {min: 30,    max: 400,    max_change_pct: 80}
  yield_pct:       {min: -1.5,  max: 12,     max_change_bp: 80}
  real_yield_pct:  {min: -3,    max: 8,      max_change_bp: 80}
  # spread_bp values are already in bp (scale: 100 applied at fetch), so a
  # 1-unit change is 1bp — bp_per_unit 1, unlike %-quoted yield series.
  spread_bp:       {min: 20,    max: 3000,   max_change_bp: 150, bp_per_unit: 1}
  crypto:          {min: 1,     max: 1000000, max_change_pct: 30}

# Staleness: a point older than this is treated as failed, not passed through.
staleness_hours:
  live: 18     # 24h-traded futures/FX and same-day session closes
  daily: 120   # official daily series (covers a weekend + holiday)

# ----------------------------------------------------------------------------
# Health / fail-closed policy.
# degraded  => do not send to `full`; alert instead.
# ----------------------------------------------------------------------------
health:
  critical_keys: [ust_10y, ust_2y, ust_10y_fut, spx_fut, ig_oas, hy_oas]
  # Run is degraded if any critical key is missing, or overall failure ratio
  # (failed + rejected) / attempted exceeds this.
  max_failure_ratio: 0.25

# Treasury auction close times are fixed by convention, not in the data feed.
# Labeled "(typical)" downstream.
auction_typical_times_et:
  Bill: "11:30"
  Note: "13:00"
  Bond: "13:00"
  CMB: "11:30"
  TIPS: "13:00"
  FRN: "11:30"
