[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketbrief"
version = "0.1.0"
description = "Blackleaf Capital automated daily market brief"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "pandas-market-calendars>=4.3",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["marketbrief*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
