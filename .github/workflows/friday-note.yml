# Daily market brief — 6:30am America/New_York, Mon–Fri.
#
# Scheduling design: GitHub Actions cron can fire late and cron is UTC-only,
# so two crons fire an hour apart (09:45 & 10:45 UTC) and the runner decides:
# the firing that lands 0–75 minutes before 6:30 ET proceeds and sleeps to
# the exact send instant; the other exits immediately. That covers both EST
# and EDT with no hardcoded offset, absorbs typical Actions delay, and the
# runner refuses to send more than 25 minutes late. Idempotency: the runner
# checks for an earlier successful scheduled run today (plus a Resend
# Idempotency-Key), and this concurrency group serializes overlapping runs.
name: Friday Markets Note

on:
  schedule:
    - cron: "45 9 * * 5"     # in-window during EDT (05:45 ET)
    - cron: "45 10 * * 5"    # in-window during EST (05:45 ET); EDT late-retry
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = email me only, now; dry-run = render only; send = staged scheduled send"
        type: choice
        default: preview
        options: [preview, dry-run, send]

permissions:
  contents: read
  actions: read      # idempotency check reads today's workflow runs
  issues: write      # failure alerting without any external secrets

concurrency:
  group: friday-markets-note
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 110   # window sleep (≤75min) + fetch/generate/send
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run brief pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          RECIPIENTS_TEST: ${{ secrets.RECIPIENTS_TEST }}
          RECIPIENTS_FULL: ${{ secrets.RECIPIENTS_FULL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          RECIPIENT_TIER: ${{ vars.RECIPIENT_TIER }}
          MODEL: ${{ vars.MODEL }}
        run: |
          python -m marketbrief run --mode "${{ inputs.mode || 'send' }}"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-${{ github.run_id }}
          path: |
            out/email.html
            out/email.txt
            out/snapshot.json
            out/verification-table.txt
            out/run-summary.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Alert on failure (GitHub issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `Friday Markets Note run FAILED — ${today}`;
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Event: ${context.eventName}`,
              "",
              "The weekly note did not complete. Fail-closed policy means nothing",
              "was sent to the list. Check the run log and out/run-summary.json artifact.",
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "brief-failure", per_page: 10,
            });
            const existing = open.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ["brief-failure"],
              });
            }
