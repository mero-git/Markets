# Manual data-layer verification run.
# Fetches every configured instrument from the real sources, prints the
# verification table into the job log, and uploads the full snapshot JSON
# as an artifact — so the numbers can be hand-checked against a terminal
# before the generation layer ever sees them. Sends nothing.
name: Fetch snapshot (verification)

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: Debug-level fetch logging
        type: boolean
        default: false
      publish_snapshot:
        description: Also force-push the snapshot to the data-snapshot branch
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: Fetch snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python -m marketbrief ${{ inputs.verbose && '-v' || '' }} fetch --json snapshot.json | tee table.txt

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: |
            snapshot.json
            table.txt
          retention-days: 14

      # Publishes the snapshot to a data branch so it can be fetched and
      # re-rendered offline with `marketbrief render` from environments whose
      # egress policy blocks the market data hosts and artifact storage.
      - name: Publish snapshot to data branch
        if: ${{ inputs.publish_snapshot }}
        run: |
          sha256sum snapshot.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-snapshot
          git rm -rf --cached . >/dev/null
          git add -f snapshot.json table.txt
          git commit -q -m "Snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin data-snapshot
